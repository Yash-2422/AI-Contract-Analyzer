# CPU-only production overrides for the existing Docker Compose deployment.
# Requires Docker Compose 2.24.4+ for the !reset and !override tags.
# Required secrets are read from a project-root .env file and are never
# written into this file.

services:
  db:
    restart: always
    ports: !reset []
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-contract_analyzer}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  # Redis is unused by the current application. Keep the local service
  # definition available, but don't start it in the production profile.
  redis:
    profiles:
      - local-only
    restart: always
    ports: !reset []

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: always
    ports: !reset []
    environment:
      DATABASE_URL: "${APP_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_APP_USER:-contract_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the project-root .env file}@db:5432/${POSTGRES_DB:-contract_analyzer}}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:-contract_app}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the project-root .env file}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      ENVIRONMENT: production
      DEBUG: "False"
      LLM_PROVIDER: gemini
      OCR_PROVIDER: gemini
      EMBEDDING_PROVIDER: gemini
      GEMINI_API_KEY: "${GEMINI_API_KEY:?Set GEMINI_API_KEY in the project-root .env file}"
      GEMINI_MODEL_NAME: "${GEMINI_MODEL_NAME:-gemini-3.1-flash-lite}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
      GEMINI_EMBEDDING_MODEL_NAME: "${GEMINI_EMBEDDING_MODEL_NAME:-gemini-embedding-2}"
    depends_on: !override
      db:
        condition: service_healthy
    volumes: !override
      - uploads_data:/app/storage/uploads
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]

  migrate:
    profiles: ["migration"]
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: "${MIGRATION_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-contract_analyzer}}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:-contract_app}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the project-root .env file}"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/run_migrations.py"]

  frontend:
    restart: always
    # Set FRONTEND_HOST_PORT in the project-root .env to change the host port.
    ports: !override
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  uploads_data:
