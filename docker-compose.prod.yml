# Production overrides. Use alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires a recent Docker Compose (2.24.4+) - uses the !reset and
# !override tags. Compose APPENDS list values such as ports and volumes
# across files, so a plain `ports: []` does not remove anything - the
# tags below do.
#
# Secrets come from a project-root .env file on the server (never
# committed). Compose refuses to start if a required one is missing.
#
# Server prerequisites for the ollama service (GPU):
#   - NVIDIA driver installed on the host
#   - NVIDIA Container Toolkit installed and configured for Docker
#   Verify with:
#     docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# What changes from dev:
#   - db, redis, ollama and backend publish no host ports.
#   - The backend's source bind-mount is replaced by a named volume for
#     uploaded contracts.
#   - Ollama runs as a compose service with GPU access; the backend
#     reaches it at http://ollama:11434 (set below, overrides Backend/.env).
#   - DATABASE_URL and JWT_SECRET_KEY are set here from the root .env and
#     override whatever Backend/.env contains (environment: beats env_file:).
#   - Restart policy is "always".

services:
  db:
    restart: always
    ports: !reset []
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}"
      POSTGRES_DB: "${POSTGRES_DB:-contract_analyzer}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  redis:
    restart: always
    ports: !reset []

  ollama:
    image: ollama/ollama:latest
    container_name: contract-analyzer-ollama
    restart: always
    environment:
      # Same settings that were used on the local machine.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # Keep the model loaded between requests so the first call after a
      # quiet period doesn't pay the full model-load time again.
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    restart: always
    ports: !reset []
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}@db:5432/${POSTGRES_DB:-contract_analyzer}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the project-root .env file}"
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    volumes: !override
      - uploads_data:/app/storage/uploads
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]

  frontend:
    restart: always

volumes:
  uploads_data:
  ollama_data: