<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Contract Analyzer — Contract intelligence, beautifully read</title>
    <meta
      name="description"
      content="Upload a contract and get every risky clause flagged, explained, and cited to the page — in minutes, not a full read-through."
    />
    <meta name="theme-color" content="#F3F0E8" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;450;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("theme-storage") || "null");
          var theme = stored && stored.state ? stored.state.theme : null;
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (!theme && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          document.documentElement.style.backgroundColor = isDark ? "#101B19" : "#F3F0E8";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
