server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets - meaningfully shrinks the JS bundle over the wire.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively - Vite fingerprints filenames,
    # so a new deploy naturally busts this cache without needing a manual
    # cache-clear step.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow contract uploads up to the application's 25 MB limit
        # with a small margin for multipart request overhead.
        client_max_body_size 26M;

        # LLM operations can take longer on GPU-constrained hardware.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Required for SSE chat streaming.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # SPA fallback: any path that isn't a real file
    # serves index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}