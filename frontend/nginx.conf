server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets - meaningfully shrinks the JS bundle over the wire.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively - Vite fingerprints filenames,
    # so a new deploy naturally busts this cache without needing a manual
    # cache-clear step.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container. Matches vite.config.ts's
    # dev-server proxy so frontend code never needs to know whether it's
    # running against the Vite dev server or this nginx in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any path that isn't a real file (e.g. /contracts/abc123
    # on a hard refresh) serves index.html so React Router can handle it
    # client-side, instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}