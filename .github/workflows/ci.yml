name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      # Free up runner disk before installing ML deps. GitHub-hosted runners
      # ship with several GB of preinstalled toolchains (.NET, Android SDK,
      # GHC, CodeQL) that this job never touches - removing them buys back
      # headroom without touching anything the build actually needs.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      # CI only: install CPU-only PyTorch from PyTorch's own CPU wheel index
      # *before* requirements.txt is installed. The default PyPI `torch`
      # wheel drags in several GB of nvidia-*/CUDA runtime packages that a
      # CI runner never uses (and has no GPU for) - this is what was
      # exhausting the runner's disk. Installing the CPU build first means
      # pip sees torch's requirement already satisfied when it later
      # processes requirements.txt (via sentence-transformers) and never
      # reaches for the CUDA wheel. Local dev / production (GPU) installs
      # are untouched since requirements.txt itself isn't modified.
      - name: Install CPU-only PyTorch (CI only, avoids CUDA download)
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: Backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Enable pgvector extension
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d contract_analyzer_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        working-directory: Backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/contract_analyzer_test
        run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build